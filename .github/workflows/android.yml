name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  full-source-rules:
    name: Full Source Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code and Harness
        uses: actions/checkout@v4
        with:
          # The source-rule entry points live in the pinned harness submodule.
          submodules: recursive
          # A private harness repository needs this read-only secret. Public
          # harnesses fall back to the workflow token.
          token: ${{ secrets.HARNESS_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Full Source Rules Bundle
        run: bash harness/scripts/check-full-source-rules.sh

      - name: Verify Full Source Rules Wiring
        if: always()
        run: bash harness/scripts/tests/full-source-rules-contract-test.sh

  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Cache and set up Gradle
      # The actions/setup-gradle action automatically handles caching for dependencies and build cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Make gradlew executable
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 5: Run Code Quality and Security Checks
      - name: Run Code Quality & Security Checks
        run: ./gradlew ktlintCheck detekt lintDebug lintRelease

      # Step 6: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Step 8: Distribute Debug build to Firebase App Distribution (Master branch only)
      - name: Create Firebase Service Account file
        if: github.ref == 'refs/heads/master' && env.FIREBASE_SERVICE_ACCOUNT_KEY != ''
        run: echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > firebase-credentials.json

      - name: Upload Debug Build to Firebase App Distribution
        if: github.ref == 'refs/heads/master' && env.FIREBASE_SERVICE_ACCOUNT_KEY != ''
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS || 'MyAccounts' }}
          FIREBASE_RELEASE_NOTES: ${{ secrets.FIREBASE_RELEASE_NOTES || 'CI/CD Automated Build on push to master' }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: firebase-credentials.json
        run: ./gradlew appDistributionUploadDebug

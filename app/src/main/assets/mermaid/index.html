<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mermaid Renderer</title>
    <script src="mermaid.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
        }
        svg {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
        }
        .error-container {
            color: #E53935;
            background-color: rgba(229, 57, 53, 0.08);
            border: 1px solid rgba(229, 57, 53, 0.25);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            font-family: monospace;
            max-width: 90%;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose'
            });
        }

        window.renderMermaid = function(code, isDark, primaryColor, surfaceColor, bgColor, textColor, borderColor) {
            const container = document.getElementById('container');
            if (!container) return;

            if (!code || code.trim() === '') {
                container.innerHTML = '';
                return;
            }

            try {
                if (typeof mermaid === 'undefined') {
                    container.innerHTML = '<div class="error-container">Mermaid library loading...</div>';
                    return;
                }

                mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: 'loose',
                    theme: isDark ? 'dark' : 'default',
                    themeVariables: {
                        primaryColor: primaryColor || '#7C6CF2',
                        primaryTextColor: textColor || '#191627',
                        primaryBorderColor: borderColor || '#E7E3F6',
                        lineColor: primaryColor || '#7C6CF2',
                        secondaryColor: primaryColor || '#7C6CF2',
                        tertiaryColor: surfaceColor || '#FFFFFF',
                        background: bgColor || '#F8F7FF',
                        mainBkg: surfaceColor || '#FFFFFF',
                        nodeBorder: borderColor || '#E7E3F6',
                        textColor: textColor || '#191627'
                    }
                });

                const renderId = 'diagram_' + Date.now();
                mermaid.render(renderId, code).then(function(result) {
                    container.innerHTML = result.svg;
                }).catch(function(err) {
                    container.innerHTML = '<div class="error-container">' + (err.message || err) + '</div>';
                });
            } catch (e) {
                container.innerHTML = '<div class="error-container">' + (e.message || e) + '</div>';
            }
        };
    </script>
</body>
</html>
